server.port=8080

# ========================
# DATABASE CONFIGURATION
# ========================
spring.datasource.url=jdbc:postgresql://localhost:5432/hogwarts_school
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# JPA/HIBERNATE CONFIGURATION
# ========================
# ????????????? validate - Hibernate ????????? ?????, ?? ?? ???????? ??
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================
# LIQUIBASE CONFIGURATION
# ========================
# ???? ? ???????? ????? ????????
spring.liquibase.change-log=classpath:liquibase/changelog-master.yml
spring.liquibase.enabled=true
spring.liquibase.drop-first=false

# ========================
# AVATARS CONFIGURATION
# ========================
avatars.dir.path=./avatars
avatars.preview.width=100
avatars.preview.height=100
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ========================
# SWAGGER/OPENAPI CONFIG
# ========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ========================
# LOGGING CONFIGURATION
# ========================
logging.level.ru.hogwarts.school=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.liquibase=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ========================
# APPLICATION INFO
# ========================
spring.application.name=hogwarts-school
spring.liquibase.change-log=classpath:liquibase/changelog-master.yml
spring.liquibase.enabled=true
spring.jpa.hibernate.ddl-auto=validate