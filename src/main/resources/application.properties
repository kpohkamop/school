# ========================
# SERVER CONFIGURATION
# ========================
server.port=8080
server.servlet.context-path=/

# ========================
# SWAGGER/OPENAPI CONFIG
# ========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ????????? ????? ?????????? Actuator ? Swagger (????????? false)
springdoc.show-actuator=false

# ????????? ??????? ??? ????????????
springdoc.packages-to-scan=ru.hogwarts.school.controller
springdoc.paths-to-match=/**

# ========================
# LOGGING CONFIGURATION
# ========================
logging.level.ru.hogwarts.school=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springdoc=INFO

# ?????? ?????
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ========================
# SPRING MVC CONFIG
# ========================
spring.mvc.servlet.load-on-startup=1

# ========================
# APPLICATION INFO
# ========================
spring.application.name=hogwarts-school
info.app.name=Hogwarts School API
info.app.version=1.0.0
info.app.description=API ??? ?????????? ??????????