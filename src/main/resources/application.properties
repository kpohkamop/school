server.port=8080

# ========================
# DATABASE CONFIGURATION
# ========================
# ????????? ???? ?????? PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/hogwarts_school
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# JPA/HIBERNATE CONFIGURATION
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ????????? ?????????????? ????????????? ????? SQL ?????
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# ========================
# SWAGGER/OPENAPI CONFIG
# ========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=false
springdoc.packages-to-scan=ru.hogwarts.school.controller
springdoc.paths-to-match=/**

# ========================
# LOGGING CONFIGURATION
# ========================
logging.level.ru.hogwarts.school=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springdoc=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ========================
# APPLICATION INFO
# ========================
spring.application.name=hogwarts-school
info.app.name=Hogwarts School API
info.app.version=1.0.0

# ========================
# AVATARS CONFIGURATION (????? ?????????)
# ========================
# ?????????? ??? ?????????? ????????
avatars.dir.path=./avatars

# ??????? ??????
avatars.preview.width=100
avatars.preview.height=100

# ???????????? ?????? ???????????? ????? (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB